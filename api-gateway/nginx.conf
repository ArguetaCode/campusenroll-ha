events {}

http {
  log_format campusenroll '$remote_addr - $request_method $uri '
                          'status=$status upstream=$upstream_addr '
                          'upstream_status=$upstream_status request_time=$request_time';

  proxy_connect_timeout 3s;
  proxy_send_timeout 15s;
  proxy_read_timeout 15s;
  proxy_next_upstream error timeout http_502 http_503 http_504;
  proxy_next_upstream_tries 2;

  upstream student_service {
    server student-service:8081 max_fails=2 fail_timeout=10s;
  }

  upstream course_service {
    server course-service:8082 max_fails=2 fail_timeout=10s;
  }

  upstream billing_service {
    server billing-service:8083 max_fails=2 fail_timeout=10s;
  }

  upstream notification_service {
    server notification-service:8084 max_fails=2 fail_timeout=10s;
  }

  upstream enrollment_service {
    server enrollment-service:8085 max_fails=2 fail_timeout=10s;
  }

  server {
    listen 8080;
    server_name _;

    add_header X-Gateway "campusenroll-nginx" always;
    access_log /var/log/nginx/access.log campusenroll;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    location = /health {
      access_log off;
      default_type application/json;
      return 200 '{"status":"UP","service":"api-gateway"}';
    }


    location = /nginx_status {
      stub_status;
      access_log off;
    }

    location = /health/student-service {
      access_log off;
      proxy_pass http://student_service/actuator/health;
    }

    location = /health/course-service {
      access_log off;
      proxy_pass http://course_service/actuator/health;
    }

    location = /health/billing-service {
      access_log off;
      proxy_pass http://billing_service/actuator/health;
    }

    location = /health/notification-service {
      access_log off;
      proxy_pass http://notification_service/actuator/health;
    }

    location = /health/enrollment-service {
      access_log off;
      proxy_pass http://enrollment_service/actuator/health;
    }

    location = /students {
      proxy_pass http://student_service/students;
    }

    location ~ ^/students/[^/]+/notifications/?$ {
      proxy_pass http://notification_service;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /students/ {
      proxy_pass http://student_service;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/students {
      proxy_pass http://student_service/api/students;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/students/ {
      proxy_pass http://student_service;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /courses {
      proxy_pass http://course_service/courses;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /courses/ {
      proxy_pass http://course_service;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sections {
      proxy_pass http://course_service/sections;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /sections/ {
      proxy_pass http://course_service;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /payments {
      proxy_pass http://billing_service/payments;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /payments/ {
      proxy_pass http://billing_service;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /notifications {
      proxy_pass http://notification_service/notifications;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /notifications/ {
      proxy_pass http://notification_service;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/enrollments {
      proxy_pass http://enrollment_service/api/enrollments;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/enrollments/ {
      proxy_pass http://enrollment_service;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/students/[^/]+/enrollments/?$ {
      proxy_pass http://enrollment_service;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
