# CampusEnroll-HA LAN gateway example.
# Copy to api-gateway/nginx.lan.conf and replace 192.168.1.x with real node IPs.
# This file is intentionally not mounted by the default docker-compose.yml.
# This provides manual/simple failover behavior only. Nginx OSS does not run
# active upstream health checks; failures are detected while proxying requests.

events {}

http {
  log_format campusenroll '$remote_addr - $request_method $uri '
                          'status=$status upstream=$upstream_addr '
                          'upstream_status=$upstream_status request_time=$request_time';

  proxy_connect_timeout 3s;
  proxy_send_timeout 15s;
  proxy_read_timeout 15s;
  proxy_next_upstream error timeout http_502 http_503 http_504;
  proxy_next_upstream_tries 2;

  upstream student_service {
    server 192.168.1.30:8081 max_fails=2 fail_timeout=10s;
    server 192.168.1.31:8081 max_fails=2 fail_timeout=10s backup;
  }

  upstream course_service {
    server 192.168.1.30:8082 max_fails=2 fail_timeout=10s;
    server 192.168.1.31:8082 max_fails=2 fail_timeout=10s backup;
  }

  upstream billing_service {
    server 192.168.1.31:8083 max_fails=2 fail_timeout=10s;
    server 192.168.1.30:8083 max_fails=2 fail_timeout=10s backup;
  }

  upstream notification_service {
    server 192.168.1.31:8084 max_fails=2 fail_timeout=10s;
    server 192.168.1.30:8084 max_fails=2 fail_timeout=10s backup;
  }

  upstream enrollment_service {
    server 192.168.1.31:8085 max_fails=2 fail_timeout=10s;
    server 192.168.1.30:8085 max_fails=2 fail_timeout=10s backup;
  }

  server {
    listen 8080;
    server_name _;

    add_header X-Gateway "campusenroll-nginx-lan" always;
    access_log /var/log/nginx/access.log campusenroll;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    location = /health {
      access_log off;
      default_type application/json;
      return 200 '{"status":"UP","service":"api-gateway","mode":"lan-example"}';
    }

    location = /health/student-service { access_log off; proxy_pass http://student_service/actuator/health; }
    location = /health/course-service { access_log off; proxy_pass http://course_service/actuator/health; }
    location = /health/billing-service { access_log off; proxy_pass http://billing_service/actuator/health; }
    location = /health/notification-service { access_log off; proxy_pass http://notification_service/actuator/health; }
    location = /health/enrollment-service { access_log off; proxy_pass http://enrollment_service/actuator/health; }

    location = /students { proxy_pass http://student_service/students; }
    location /students/ { proxy_pass http://student_service; }
    location = /api/students { proxy_pass http://student_service/api/students; }
    location /api/students/ { proxy_pass http://student_service; }

    location = /courses { proxy_pass http://course_service/courses; }
    location /courses/ { proxy_pass http://course_service; }
    location = /sections { proxy_pass http://course_service/sections; }
    location /sections/ { proxy_pass http://course_service; }

    location = /payments { proxy_pass http://billing_service/payments; }
    location /payments/ { proxy_pass http://billing_service; }

    location = /notifications { proxy_pass http://notification_service/notifications; }
    location /notifications/ { proxy_pass http://notification_service; }

    location = /api/enrollments { proxy_pass http://enrollment_service/api/enrollments; }
    location /api/enrollments/ { proxy_pass http://enrollment_service; }
    location ~ ^/api/students/[^/]+/enrollments/?$ { proxy_pass http://enrollment_service; }
  }
}
