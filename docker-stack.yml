configs:
  campusenroll_nginx_swarm_conf:
    file: ./api-gateway/nginx.swarm.conf

networks:
  campusenroll_app_net:
    driver: overlay
    attachable: true

x-common-service: &common-service
  networks:
    - campusenroll_app_net
  deploy:
    mode: replicated
    replicas: 2
    endpoint_mode: vip
    placement:
      max_replicas_per_node: 1
      preferences:
        - spread: node.id
    restart_policy:
      condition: any
      delay: 5s
      max_attempts: 5
      window: 60s
    update_config:
      parallelism: 1
      delay: 10s
      order: start-first
      failure_action: rollback
    rollback_config:
      parallelism: 1
      delay: 5s
      order: stop-first

services:
  student-service:
    <<: *common-service
    image: ${STUDENT_SERVICE_IMAGE}
    environment:
      SERVER_PORT: "8081"
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-campusenroll}
      DB_USER: ${DB_USER:-campus}
      DB_PASSWORD: ${DB_PASSWORD:-campus123}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT:-5432}/${DB_NAME:-campusenroll}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-campus}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-campus123}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 45s

  course-service:
    <<: *common-service
    image: ${COURSE_SERVICE_IMAGE}
    environment:
      SERVER_PORT: "8082"
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-campusenroll}
      DB_USER: ${DB_USER:-campus}
      DB_PASSWORD: ${DB_PASSWORD:-campus123}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT:-5432}/${DB_NAME:-campusenroll}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-campus}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-campus123}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 45s

  billing-service:
    <<: *common-service
    image: ${BILLING_SERVICE_IMAGE}
    environment:
      SERVER_PORT: "8083"
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-campusenroll}
      DB_USER: ${DB_USER:-campus}
      DB_PASSWORD: ${DB_PASSWORD:-campus123}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT:-5432}/${DB_NAME:-campusenroll}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-campus}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-campus123}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-campus}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-campus123}
      SPRING_RABBITMQ_HOST: ${RABBITMQ_HOST}
      SPRING_RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-campus}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-campus123}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_REDIS_HOST: ${REDIS_HOST}
      SPRING_REDIS_PORT: ${REDIS_PORT:-6379}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 45s

  notification-service:
    <<: *common-service
    image: ${NOTIFICATION_SERVICE_IMAGE}
    environment:
      SERVER_PORT: "8084"
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-campusenroll}
      DB_USER: ${DB_USER:-campus}
      DB_PASSWORD: ${DB_PASSWORD:-campus123}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT:-5432}/${DB_NAME:-campusenroll}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-campus}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-campus123}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-campus}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-campus123}
      SPRING_RABBITMQ_HOST: ${RABBITMQ_HOST}
      SPRING_RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-campus}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-campus123}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_REDIS_HOST: ${REDIS_HOST}
      SPRING_REDIS_PORT: ${REDIS_PORT:-6379}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 45s

  enrollment-service:
    <<: *common-service
    image: ${ENROLLMENT_SERVICE_IMAGE}
    environment:
      SERVER_PORT: "8085"
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-campusenroll}
      DB_USER: ${DB_USER:-campus}
      DB_PASSWORD: ${DB_PASSWORD:-campus123}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT:-5432}/${DB_NAME:-campusenroll}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-campus}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-campus123}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-campus}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-campus123}
      SPRING_RABBITMQ_HOST: ${RABBITMQ_HOST}
      SPRING_RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-campus}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-campus123}
      STUDENT_SERVICE_URL: ${STUDENT_SERVICE_URL:-http://student-service:8081}
      COURSE_SERVICE_URL: ${COURSE_SERVICE_URL:-http://course-service:8082}
      BILLING_SERVICE_URL: ${BILLING_SERVICE_URL:-http://billing-service:8083}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:-http://notification-service:8084}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8085/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 45s

  api-gateway:
    image: ${API_GATEWAY_IMAGE}
    networks:
      - campusenroll_app_net
    configs:
      - source: campusenroll_nginx_swarm_conf
        target: /etc/nginx/nginx.conf
    ports:
      - target: 8080
        published: ${GATEWAY_PUBLISHED_PORT:-8080}
        protocol: tcp
        mode: ingress
    deploy:
      mode: replicated
      replicas: 2
      endpoint_mode: vip
      placement:
        max_replicas_per_node: 1
        preferences:
          - spread: node.id
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 5
        window: 60s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 5s
        order: stop-first
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
