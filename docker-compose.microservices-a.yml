services:
  student-service:
    build:
      context: ../student-service
      dockerfile: Dockerfile
    container_name: campusenroll-student-service
    restart: unless-stopped
    environment:
      SERVER_PORT: ${STUDENT_SERVER_PORT:-8081}
      DB_HOST: ${DB_HOST:-192.168.0.13}
      DB_PORT: ${DB_PORT:-5000}
      DB_NAME: ${DB_NAME:-campusenroll}
      DB_USER: ${DB_USER:-campus}
      DB_PASSWORD: ${DB_PASSWORD:-campus123}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-192.168.0.13}:${DB_PORT:-5000}/${DB_NAME:-campusenroll}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-campus}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-campus123}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    networks:
      - campusenroll-net

  course-service:
    build:
      context: ../course-service
      dockerfile: Dockerfile
    container_name: campusenroll-course-service
    restart: unless-stopped
    environment:
      SERVER_PORT: ${COURSE_SERVER_PORT:-8082}
      DB_HOST: ${DB_HOST:-192.168.0.13}
      DB_PORT: ${DB_PORT:-5000}
      DB_NAME: ${DB_NAME:-campusenroll}
      DB_USER: ${DB_USER:-campus}
      DB_PASSWORD: ${DB_PASSWORD:-campus123}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-192.168.0.13}:${DB_PORT:-5000}/${DB_NAME:-campusenroll}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-campus}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-campus123}
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    networks:
      - campusenroll-net

networks:
  campusenroll-net:
    driver: bridge
