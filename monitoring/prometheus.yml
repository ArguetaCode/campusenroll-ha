global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["campusenroll-prometheus:9090"]

  - job_name: "billing-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["billing-service:8083"]

  - job_name: "notification-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["notification-service:8084"]

  - job_name: "student-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["student-service:8081"]

  - job_name: "course-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["course-service:8082"]

  - job_name: "enrollment-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["enrollment-service:8085"]

  - job_name: "rabbitmq"
    static_configs:
      - targets: ["campusenroll-rabbitmq:15692"]

  - job_name: "redis"
    static_configs:
      - targets: ["campusenroll-redis-exporter:9121"]

  - job_name: "postgresql"
    static_configs:
      - targets: ["campusenroll-postgres-exporter:9187"]

  - job_name: "api-gateway"
    static_configs:
      - targets: ["campusenroll-nginx-exporter:9113"]
