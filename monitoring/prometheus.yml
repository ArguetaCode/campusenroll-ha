global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["campusenroll-prometheus:9090"]

  - job_name: "billing-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["billing-service:8083"]

  - job_name: "notification-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["notification-service:8085"]