global
    log stdout format raw local0
    maxconn 4096

defaults
    log global
    mode tcp
    timeout connect 5s
    timeout client 60s
    timeout server 60s

frontend redis_tcp
    bind *:6379
    default_backend redis_master_nodes

backend redis_master_nodes
    option tcp-check
    tcp-check connect
    tcp-check send PING\r\n
    tcp-check expect string +PONG
    tcp-check send INFO\ replication\r\n
    tcp-check expect string role:master
    tcp-check send QUIT\r\n
    tcp-check expect string +OK
    server redis-mefi 192.168.0.10:6379 check inter 2s fall 3 rise 2
    server redis-brayan 192.168.0.11:6379 check inter 2s fall 3 rise 2
    server redis-jared 192.168.0.12:6379 check inter 2s fall 3 rise 2

frontend redis_haproxy_stats
    bind *:8405
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
