global
    log stdout format raw local0

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 1h
    timeout server 1h

frontend rabbitmq_amqp
    bind *:5672
    default_backend rabbitmq_amqp_nodes

backend rabbitmq_amqp_nodes
    option tcp-check
    server rabbitmq-mefi 192.168.0.10:5672 check inter 2s fall 3 rise 2
    server rabbitmq-brayan 192.168.0.11:5672 check inter 2s fall 3 rise 2
    server rabbitmq-jared 192.168.0.12:5672 check inter 2s fall 3 rise 2

frontend rabbitmq_management
    bind *:15672
    default_backend rabbitmq_management_nodes

backend rabbitmq_management_nodes
    mode http
    option httpchk GET /
    server rabbitmq-mefi 192.168.0.10:15672 check inter 5s fall 3 rise 2
    server rabbitmq-brayan 192.168.0.11:15672 check inter 5s fall 3 rise 2
    server rabbitmq-jared 192.168.0.12:15672 check inter 5s fall 3 rise 2

frontend rabbitmq_prometheus
    bind *:15692
    default_backend rabbitmq_prometheus_nodes

backend rabbitmq_prometheus_nodes
    mode http
    option httpchk GET /metrics
    server rabbitmq-mefi 192.168.0.10:15692 check inter 5s fall 3 rise 2
    server rabbitmq-brayan 192.168.0.11:15692 check inter 5s fall 3 rise 2
    server rabbitmq-jared 192.168.0.12:15692 check inter 5s fall 3 rise 2

