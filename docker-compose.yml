services:
  campusenroll-postgres:
    image: postgres:16
    container_name: campusenroll-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-campus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-campus123}
      POSTGRES_DB: ${DB_NAME:-campusenroll}
    ports:
      - "55432:5432"
    volumes:
      - campusenroll_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-campus} -d ${DB_NAME:-campusenroll}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - campusenroll-net

  campusenroll-flyway:
    image: flyway/flyway:10
    container_name: campusenroll-flyway
    profiles:
      - db-migration
    command:
      - -url=jdbc:postgresql://${DB_HOST:-campusenroll-postgres}:${DB_PORT:-5432}/${DB_NAME:-campusenroll}
      - -user=${DB_USER:-campus}
      - -password=${DB_PASSWORD:-campus123}
      - -schemas=campusenroll
      - -connectRetries=30
      - migrate
    volumes:
      - ./database/migrations:/flyway/sql:ro
    depends_on:
      - campusenroll-postgres
    networks:
      - campusenroll-net

  campusenroll-redis:
    image: redis:7
    container_name: campusenroll-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - campusenroll-net

  campusenroll-redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    container_name: campusenroll-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://campusenroll-redis:6379
    ports:
      - "9121:9121"
    depends_on:
      campusenroll-redis:
        condition: service_healthy
    networks:
      - campusenroll-net

  campusenroll-rabbitmq:
    image: rabbitmq:3-management
    container_name: campusenroll-rabbitmq
    restart: unless-stopped
    command: ["sh", "-c", "rabbitmq-plugins enable --offline rabbitmq_prometheus && rabbitmq-server"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-campus}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-campus123}
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - campusenroll-net

  campusenroll-postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: campusenroll-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${DB_USER:-campus}:${DB_PASSWORD:-campus123}@campusenroll-postgres:5432/${DB_NAME:-campusenroll}?sslmode=disable
    ports:
      - "9187:9187"
    depends_on:
      campusenroll-postgres:
        condition: service_healthy
    networks:
      - campusenroll-net

  campusenroll-prometheus:
    image: prom/prometheus
    container_name: campusenroll-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - campusenroll-net

  campusenroll-grafana:
    image: grafana/grafana
    container_name: campusenroll-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - campusenroll-net

  campusenroll-api-gateway:
    image: nginx:1.27-alpine
    container_name: campusenroll-api-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      student-service:
        condition: service_healthy
      course-service:
        condition: service_healthy
      billing-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      enrollment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - campusenroll-net

  campusenroll-nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4
    container_name: campusenroll-nginx-exporter
    restart: unless-stopped
    command:
      - -nginx.scrape-uri=http://campusenroll-api-gateway:8080/nginx_status
    ports:
      - "9113:9113"
    depends_on:
      campusenroll-api-gateway:
        condition: service_healthy
    networks:
      - campusenroll-net

  k6:
    image: grafana/k6
    container_name: campusenroll-k6
    profiles:
      - testing
    volumes:
      - ./tests:/scripts
      - ./artifacts/k6:/artifacts
    depends_on:
      campusenroll-api-gateway:
        condition: service_healthy
    networks:
      - campusenroll-net

  billing-service:
    build:
      context: ../billing-service
      dockerfile: Dockerfile
    container_name: campusenroll-billing-service
    restart: unless-stopped
    environment:
      SERVER_PORT: ${BILLING_SERVER_PORT:-8083}
      DB_HOST: ${DB_HOST:-campusenroll-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-campusenroll}
      DB_USER: ${DB_USER:-campus}
      DB_PASSWORD: ${DB_PASSWORD:-campus123}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-campusenroll-postgres}:${DB_PORT:-5432}/${DB_NAME:-campusenroll}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-campus}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-campus123}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-campusenroll-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-campus}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-campus123}
      SPRING_RABBITMQ_HOST: ${RABBITMQ_HOST:-campusenroll-rabbitmq}
      SPRING_RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-campus}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-campus123}
      REDIS_HOST: ${REDIS_HOST:-campusenroll-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_REDIS_HOST: ${REDIS_HOST:-campusenroll-redis}
      SPRING_REDIS_PORT: ${REDIS_PORT:-6379}
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    depends_on:
      campusenroll-postgres:
        condition: service_healthy
      campusenroll-redis:
        condition: service_healthy
      campusenroll-rabbitmq:
        condition: service_healthy
    networks:
      - campusenroll-net

  notification-service:
    build:
      context: ../notification
      dockerfile: Dockerfile
    container_name: campusenroll-notification-service
    restart: unless-stopped
    environment:
      SERVER_PORT: ${NOTIFICATION_SERVER_PORT:-8084}
      DB_HOST: ${DB_HOST:-campusenroll-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-campusenroll}
      DB_USER: ${DB_USER:-campus}
      DB_PASSWORD: ${DB_PASSWORD:-campus123}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-campusenroll-postgres}:${DB_PORT:-5432}/${DB_NAME:-campusenroll}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-campus}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-campus123}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-campusenroll-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-campus}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-campus123}
      SPRING_RABBITMQ_HOST: ${RABBITMQ_HOST:-campusenroll-rabbitmq}
      SPRING_RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-campus}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-campus123}
      REDIS_HOST: ${REDIS_HOST:-campusenroll-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_REDIS_HOST: ${REDIS_HOST:-campusenroll-redis}
      SPRING_REDIS_PORT: ${REDIS_PORT:-6379}
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8084/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    depends_on:
      campusenroll-postgres:
        condition: service_healthy
      campusenroll-redis:
        condition: service_healthy
      campusenroll-rabbitmq:
        condition: service_healthy
      billing-service:
        condition: service_healthy
    networks:
      - campusenroll-net

  student-service:
    build:
      context: ../student-service
      dockerfile: Dockerfile
    container_name: campusenroll-student-service
    restart: unless-stopped
    environment:
      SERVER_PORT: ${STUDENT_SERVER_PORT:-8081}
      DB_HOST: ${DB_HOST:-campusenroll-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-campusenroll}
      DB_USER: ${DB_USER:-campus}
      DB_PASSWORD: ${DB_PASSWORD:-campus123}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-campusenroll-postgres}:${DB_PORT:-5432}/${DB_NAME:-campusenroll}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-campus}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-campus123}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    depends_on:
      campusenroll-postgres:
        condition: service_healthy
    networks:
      - campusenroll-net

  course-service:
    build:
      context: ../course-service
      dockerfile: Dockerfile
    container_name: campusenroll-course-service
    restart: unless-stopped
    environment:
      SERVER_PORT: ${COURSE_SERVER_PORT:-8082}
      DB_HOST: ${DB_HOST:-campusenroll-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-campusenroll}
      DB_USER: ${DB_USER:-campus}
      DB_PASSWORD: ${DB_PASSWORD:-campus123}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-campusenroll-postgres}:${DB_PORT:-5432}/${DB_NAME:-campusenroll}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-campus}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-campus123}
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    depends_on:
      campusenroll-postgres:
        condition: service_healthy
    networks:
      - campusenroll-net

  enrollment-service:
    build:
      context: ../enrollment-service/enrollment-service/enrollment-service
      dockerfile: Dockerfile
    container_name: campusenroll-enrollment-service
    restart: unless-stopped
    environment:
      SERVER_PORT: ${ENROLLMENT_SERVER_PORT:-8085}
      DB_HOST: ${DB_HOST:-campusenroll-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-campusenroll}
      DB_USER: ${DB_USER:-campus}
      DB_PASSWORD: ${DB_PASSWORD:-campus123}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-campusenroll-postgres}:${DB_PORT:-5432}/${DB_NAME:-campusenroll}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-campus}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-campus123}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-campusenroll-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-campus}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-campus123}
      SPRING_RABBITMQ_HOST: ${RABBITMQ_HOST:-campusenroll-rabbitmq}
      SPRING_RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-campus}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-campus123}
      STUDENT_SERVICE_URL: ${STUDENT_SERVICE_URL:-http://student-service:8081}
      COURSE_SERVICE_URL: ${COURSE_SERVICE_URL:-http://course-service:8082}
      BILLING_SERVICE_URL: ${BILLING_SERVICE_URL:-http://billing-service:8083}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:-http://notification-service:8084}
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8085/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    depends_on:
      campusenroll-postgres:
        condition: service_healthy
      campusenroll-rabbitmq:
        condition: service_healthy
      student-service:
        condition: service_healthy
      course-service:
        condition: service_healthy
      billing-service:
        condition: service_healthy
    networks:
      - campusenroll-net

volumes:
  campusenroll_pg_data:

networks:
  campusenroll-net:
    driver: bridge
