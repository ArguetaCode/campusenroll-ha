services:
  campusenroll-postgres:
    image: postgres:16
    container_name: campusenroll-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus123
      POSTGRES_DB: campusenroll
    ports:
      - "5432:5432"
    volumes:
      - campusenroll_pg_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - campusenroll-net

  campusenroll-redis:
    image: redis:7
    container_name: campusenroll-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - campusenroll-net

  campusenroll-rabbitmq:
    image: rabbitmq:3-management
    container_name: campusenroll-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: campus
      RABBITMQ_DEFAULT_PASS: campus123
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - campusenroll-net

  campusenroll-prometheus:
    image: prom/prometheus
    container_name: campusenroll-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - campusenroll-net

  campusenroll-grafana:
    image: grafana/grafana
    container_name: campusenroll-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - campusenroll-net

volumes:
  campusenroll_pg_data:

networks:
  campusenroll-net:
    driver: bridge