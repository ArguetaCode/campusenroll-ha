services:
  campusenroll-api-gateway:
    image: nginx:1.27-alpine
    container_name: campusenroll-api-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    volumes:
      - ${GATEWAY_NGINX_CONF:-./api-gateway/nginx.conf}:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - campusenroll-net

  campusenroll-nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4
    container_name: campusenroll-nginx-exporter
    restart: unless-stopped
    command:
      - -nginx.scrape-uri=http://campusenroll-api-gateway:8080/nginx_status
    ports:
      - "9113:9113"
    depends_on:
      campusenroll-api-gateway:
        condition: service_healthy
    networks:
      - campusenroll-net

networks:
  campusenroll-net:
    driver: bridge

