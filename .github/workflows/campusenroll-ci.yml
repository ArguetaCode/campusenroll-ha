name: CampusEnroll HA CI

on:
  push:
    paths:
      - "**"
  pull_request:
    paths:
      - "**"
  workflow_dispatch:

concurrency:
  group: campusenroll-ha-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Compose, Flyway, Gateway Smoke, k6 Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35

    defaults:
      run:
        working-directory: campusenroll-ha

    steps:
      - name: Checkout campusenroll-ha
        uses: actions/checkout@v4
        with:
          path: campusenroll-ha

      - name: Validate private repository token
        shell: bash
        env:
          CI_REPOS_TOKEN: ${{ secrets.CAMPUSENROLL_CI_TOKEN }}
        run: |
          if [ -z "$CI_REPOS_TOKEN" ]; then
            echo "::error::Missing CAMPUSENROLL_CI_TOKEN. Configure it with read access to student-service, course-service, billing-service, notification, and enrollment-service."
            exit 1
          fi

      - name: Checkout student-service
        uses: actions/checkout@v4
        with:
          repository: ArguetaCode/student-service
          token: ${{ secrets.CAMPUSENROLL_CI_TOKEN }}
          path: student-service

      - name: Checkout course-service
        uses: actions/checkout@v4
        with:
          repository: ArguetaCode/course-service
          token: ${{ secrets.CAMPUSENROLL_CI_TOKEN }}
          path: course-service

      - name: Checkout billing-service
        uses: actions/checkout@v4
        with:
          repository: ArguetaCode/billing-service
          token: ${{ secrets.CAMPUSENROLL_CI_TOKEN }}
          path: billing-service

      - name: Checkout notification
        uses: actions/checkout@v4
        with:
          repository: ArguetaCode/notification
          token: ${{ secrets.CAMPUSENROLL_CI_TOKEN }}
          path: notification

      - name: Checkout enrollment-service
        uses: actions/checkout@v4
        with:
          repository: ArguetaCode/enrollment-service
          token: ${{ secrets.CAMPUSENROLL_CI_TOKEN }}
          path: enrollment-service

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Prepare k6 artifacts directory
        run: mkdir -p artifacts/k6

      - name: Start infra safely
        shell: pwsh
        run: docker compose up -d campusenroll-postgres campusenroll-redis campusenroll-rabbitmq

      - name: Run Flyway migrations
        shell: pwsh
        run: docker compose --profile db-migration run --rm campusenroll-flyway

      - name: Run gateway smoke CI
        shell: pwsh
        run: ./scripts/gateway-smoke-ci.ps1 -SkipFlyway

      - name: Run k6 smoke profile
        shell: pwsh
        run: ./scripts/k6-gateway-ci.ps1 -TestProfile smoke -SkipGatewayPrecheck

      - name: Upload k6 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campusenroll-k6-smoke
          path: campusenroll-ha/artifacts/k6/*.json
          if-no-files-found: ignore

      - name: Show container status
        if: always()
        run: docker compose ps

      - name: Stop containers without deleting volumes
        if: always()
        run: docker compose stop
