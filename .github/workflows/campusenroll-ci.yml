name: CampusEnroll HA CI

on:
  push:
    paths:
      - "**"
  pull_request:
    paths:
      - "**"
  workflow_dispatch:

concurrency:
  group: campusenroll-ha-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Compose, Flyway, Gateway Smoke, k6 Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35

    defaults:
      run:
        working-directory: campusenroll-ha

    steps:
      - name: Checkout campusenroll-ha
        uses: actions/checkout@v4
        with:
          path: campusenroll-ha

      - name: Validate private repository token
        shell: bash
        env:
          CI_REPOS_TOKEN: ${{ secrets.CAMPUSENROLL_CI_TOKEN }}
        run: |
          if [ -z "$CI_REPOS_TOKEN" ]; then
            echo "::error::Missing CAMPUSENROLL_CI_TOKEN. Configure it with read access to student-service, course-service, billing-service, notification, and enrollment-service."
            exit 1
          fi

      - name: Checkout student-service
        uses: actions/checkout@v4
        with:
          repository: ArguetaCode/student-service
          token: ${{ secrets.CAMPUSENROLL_CI_TOKEN }}
          path: student-service

      - name: Checkout course-service
        uses: actions/checkout@v4
        with:
          repository: ArguetaCode/course-service
          token: ${{ secrets.CAMPUSENROLL_CI_TOKEN }}
          path: course-service

      - name: Checkout billing-service
        uses: actions/checkout@v4
        with:
          repository: ArguetaCode/billing-service
          token: ${{ secrets.CAMPUSENROLL_CI_TOKEN }}
          path: billing-service

      - name: Checkout notification
        uses: actions/checkout@v4
        with:
          repository: ArguetaCode/notification
          token: ${{ secrets.CAMPUSENROLL_CI_TOKEN }}
          path: notification

      - name: Checkout enrollment-service
        uses: actions/checkout@v4
        with:
          repository: ArguetaCode/enrollment-service
          token: ${{ secrets.CAMPUSENROLL_CI_TOKEN }}
          path: enrollment-service

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Static guardrails
        shell: bash
        run: |
          set -euo pipefail

          conflict_start="$(printf '<%.0s' {1..7})"
          conflict_middle="$(printf '=%.0s' {1..7})"
          conflict_end="$(printf '>%.0s' {1..7})"

          if grep -R -n -e "$conflict_start" -e "$conflict_middle" -e "$conflict_end" . --exclude-dir=.git; then
            echo "::error::Git conflict markers found. Resolve conflicts before running CI."
            exit 1
          fi

          if grep -R -n -E "baselineOnMigrate[[:space:]]*=[[:space:]]*true" . --exclude-dir=.git; then
            echo "::error::baselineOnMigrate=true is not allowed in the current project phase."
            exit 1
          fi

          destructive_compose_cleanup="docker[[:space:]]+compose[[:space:]]+down[[:space:]]+-v"
          if grep -R -n -E "$destructive_compose_cleanup" .github scripts; then
            echo "::error::Destructive Docker Compose volume cleanup is not allowed in CI or smoke scripts."
            exit 1
          fi

          echo "Static guardrails passed."

      - name: Validate Docker Compose
        run: |
          docker compose config --quiet
          docker compose --profile testing config --quiet

      - name: Validate Nginx gateway config
        shell: bash
        run: |
          docker run --rm \
            --add-host student-service:127.0.0.1 \
            --add-host course-service:127.0.0.1 \
            --add-host billing-service:127.0.0.1 \
            --add-host notification-service:127.0.0.1 \
            --add-host enrollment-service:127.0.0.1 \
            -v "$PWD/api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.27-alpine nginx -t

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $files = @()
          $files += Get-ChildItem -Path scripts -Filter *.ps1 -File
          $files += Get-ChildItem -Path database/scripts -Filter *.ps1 -File

          foreach ($file in $files) {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null

              if ($errors.Count -gt 0) {
                  Write-Host "::error file=$($file.FullName)::PowerShell parse failed"
                  $errors | ForEach-Object { Write-Host "::error::$($_.Message)" }
                  exit 1
              }
          }

          Write-Host "PowerShell parse passed for $($files.Count) scripts."

      - name: Validate k6 JavaScript syntax
        run: |
          node --check tests/load-test.js
          node --check tests/enrollment-flow-smoke.js

      - name: Prepare k6 artifacts directory
        run: mkdir -p artifacts/k6

      - name: Start infra safely
        shell: pwsh
        run: docker compose up -d campusenroll-postgres campusenroll-redis campusenroll-rabbitmq

      - name: Run Flyway migrations
        shell: pwsh
        run: docker compose --profile db-migration run --rm campusenroll-flyway

      - name: Run gateway smoke CI
        shell: pwsh
        run: ./scripts/gateway-smoke-ci.ps1 -SkipFlyway

      - name: Run k6 smoke profile
        shell: pwsh
        run: ./scripts/k6-gateway-ci.ps1 -TestProfile smoke -SkipGatewayPrecheck

      - name: Upload k6 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campusenroll-k6-smoke
          path: campusenroll-ha/artifacts/k6/*.json
          if-no-files-found: ignore

      - name: Upload smoke diagnostics artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campusenroll-smoke-diagnostics
          path: campusenroll-ha/artifacts/smoke/*.txt
          if-no-files-found: ignore

      - name: Show container status
        if: always()
        run: docker compose ps

      - name: Stop containers without deleting volumes
        if: always()
        run: docker compose stop
